  public_wifi:
    context:
      id: CISA mengklasifikasikan WiFi publik di bandara, hotel, dan kafe sebagai lingkungan berisiko tinggi. Penyadapan dan
        pencurian sesi adalah alasan utamanya.
      en: CISA classifies public WiFi in airports, hotels, and cafés as high-risk. Eavesdropping and session theft top the
        list of concerns.
    stats:
    - value: High-Risk
      label:
        id: klasifikasi CISA untuk WiFi publik
        en: CISA classification for public WiFi
      note:
        id: CISA menempatkan WiFi publik dalam kategori risiko tinggi. Jaringan ini membuka vektor pencurian kredensial, session
          hijacking, dan distribusi malware.
        en: CISA puts public WiFi in the high-risk category. These networks open vectors for credential theft, session hijacking,
          and malware distribution.
      source: nist_sp800_153
    - value: '2020'
      label:
        id: FBI memperingatkan MITM di WiFi hotel
        en: FBI warned about MITM on hotel WiFi
      note:
        id: FBI mengeluarkan advisory tentang man-in-the-middle attack di jaringan WiFi hotel dan publik. Risiko tetap tinggi
          bahkan dengan peralatan sederhana.
        en: FBI issued an advisory on man-in-the-middle attacks on hotel and public WiFi. The risk stays high, even with simple
          equipment.
      source: nist_sp800_153
    - value: 193,407
      label:
        id: aduan phishing/spoofing IC3 2024
        en: phishing/spoofing complaints IC3 2024
      note:
        id: Phishing melalui jaringan tidak aman seperti WiFi publik menjadi salah satu metode pencurian kredensial yang paling
          umum.
        en: Phishing over insecure networks like public WiFi is one of the most common credential theft methods.
      source: fbi_ic3_2024
    - value: NIST SP 800-153
      label:
        id: standar NIST untuk pengamanan WLAN
        en: NIST standard for WLAN security
      note:
        id: NIST membedakan WPA2-Personal (shared key) dari WPA2-Enterprise. Yang pertama tidak memberi isolasi antar pengguna.
          Di WiFi publik, artinya semua pengguna berbagi kunci yang sama.
        en: NIST distinguishes WPA2-Personal (shared key) from WPA2-Enterprise. WPA2-Personal offers zero user isolation.
          On public WiFi, every user shares the same key.
      source: nist_sp800_153
