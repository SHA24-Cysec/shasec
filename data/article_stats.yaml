bundles:
  identity_access:
    context:
      id: Akun utama, kata sandi, 2FA, passkey, dan pemulihan akses adalah perimeter keamanan Anda. Bukan firewall. Bukan
        antivirus. Akun Anda.
      en: Primary accounts, passwords, 2FA, passkeys, and recovery paths are your security perimeter. Not your firewall. Your
        account.
    stats:
    - value: 600M+
      label:
        id: serangan identitas per hari
        en: identity attacks per day
      note:
        id: Microsoft melaporkan lebih dari 600 juta serangan identitas harian di telemetry Entra.
        en: Microsoft reported more than 600 million daily identity attacks in Entra telemetry.
      source: microsoft_mddr_2024
    - value: '>99%'
      label:
        id: serangan identitas berbasis kata sandi
        en: identity attacks were password-based
      note:
        id: Microsoft mencatat serangan berbasis kata sandi mendominasi insiden identitas.
        en: Password-based attacks still dominated the identity incidents Microsoft observed.
      source: microsoft_mddr_2024
    - value: 22%
      label:
        id: pelanggaran bermula dari penyalahgunaan kredensial
        en: breaches started with credential abuse
      note:
        id: Verizon DBIR menempatkan credential abuse sebagai salah satu vektor awal utama pelanggaran data.
        en: Verizon DBIR listed credential abuse as one of the leading initial breach vectors.
      source: verizon_dbir_2025
    - value: 93%
      label:
        id: tingkat sukses login passkey
        en: passkey login success rate
      note:
        id: FIDO Passkey Index mencatat login passkey berhasil 93%, dibanding 63% untuk metode lain.
        en: The FIDO Passkey Index reported a 93% passkey login success rate, versus 63% for other methods.
      source: fido_passkey_index_2025
  phishing_social_engineering:
    context:
      id: 'Phishing, rekayasa sosial, QR jebakan, dan pesan yang memaksa Anda mengambil keputusan cepat: inilah ukuran risikonya.'
      en: 'Phishing, social engineering, QR traps, and messages that pressure you into split-second decisions: the numbers
        are stark.'
    stats:
    - value: 193,407
      label:
        id: laporan phishing/spoofing
        en: phishing/spoofing complaints
      note:
        id: FBI IC3 mencatat phishing/spoofing sebagai kategori aduan terbanyak pada 2024.
        en: FBI IC3 recorded phishing/spoofing as the most reported complaint category in 2024.
      source: fbi_ic3_2024
    - value: 16%
      label:
        id: pelanggaran memakai phishing sebagai akses awal
        en: breaches used phishing as initial access
      note:
        id: Verizon DBIR melaporkan phishing sebagai vektor awal penting pada pelanggaran data.
        en: Verizon DBIR reported phishing as a key initial vector in data breaches.
      source: verizon_dbir_2025
    - value: 60%
      label:
        id: pelanggaran melibatkan faktor manusia
        en: breaches involved the human element
      note:
        id: DBIR menyorot tumpang tindih rekayasa sosial, kredensial, dan kesalahan manusia dalam pelanggaran.
        en: DBIR highlighted overlap between social engineering, credentials, and human error in breaches.
      source: verizon_dbir_2025
    - value: 146%
      label:
        id: kenaikan phishing adversary-in-the-middle
        en: increase in adversary-in-the-middle phishing
      note:
        id: 'Microsoft mencatat kenaikan serangan AiTM. Targetnya: sesi browser Anda, bahkan setelah Anda login dengan MFA.'
        en: Microsoft reported growth in AiTM attacks that target browser sessions of MFA-protected accounts.
      source: microsoft_mddr_2024
  fraud_scams:
    context:
      id: 'Penipuan digital menyentuh belanja online, dompet digital, rekening tujuan, lowongan, dan dukungan palsu. Skalanya:'
      en: 'Digital fraud hits online shopping, wallets, beneficiary accounts, job offers, and fake support. The scale:'
    stats:
    - value: $21B
      label:
        id: kerugian kejahatan siber yang dilaporkan
        en: reported cyber-enabled losses
      note:
        id: FBI menyatakan kerugian 2025 mendekati 21 miliar dolar dari laporan IC3.
        en: The FBI said 2025 IC3 reported losses approached 21 billion dollars.
      source: fbi_ic3_2025
    - value: 1,008,597
      label:
        id: aduan IC3 dalam setahun
        en: IC3 complaints in one year
      note:
        id: Jumlah aduan 2025 melewati satu juta laporan.
        en: The 2025 complaint volume passed one million reports.
      source: fbi_ic3_2025
    - value: $17.7B+
      label:
        id: kerugian cyber-enabled fraud
        en: cyber-enabled fraud losses
      note:
        id: FBI melaporkan lebih dari 17,7 miliar dolar kerugian cyber-enabled fraud pada 2025.
        en: The FBI reported more than 17.7 billion dollars in cyber-enabled fraud losses in 2025.
      source: fbi_ic3_2025
    - value: 8x
      label:
        id: kenaikan kerugian scam media sosial sejak 2020
        en: increase in social media scam losses since 2020
      note:
        id: FTC melaporkan kerugian scam yang bermula dari media sosial naik delapan kali lipat.
        en: The FTC reported an eightfold increase in losses from scams that began on social media.
      source: ftc_social_2025
  crypto_investment:
    context:
      id: Penipuan investasi digital dan kripto menyebabkan kerugian besar karena pelaku membangun kepercayaan palsu sebelum
        meminta transfer dana.
      en: Digital investment and crypto scams cause huge losses because perpetrators build false trust before requesting fund
        transfers.
    stats:
    - value: $11B+
      label:
        id: kerugian terkait kripto yang dilaporkan
        en: reported cryptocurrency-related losses
      note:
        id: FBI IC3 mencatat lebih dari 11 miliar dolar kerugian dalam aduan yang melibatkan kripto pada 2025.
        en: FBI IC3 recorded more than 11 billion dollars in losses involving cryptocurrency complaints in 2025.
      source: fbi_ic3_2025
    - value: 181,565
      label:
        id: aduan yang melibatkan kripto
        en: cryptocurrency-related complaints
      note:
        id: Volume laporan membuktikan kripto muncul di banyak skema penipuan. Bukan cuma investasi.
        en: The complaint volume shows crypto appears across many fraud schemes, not only investment scams.
      source: fbi_ic3_2025
    - value: 49%
      label:
        id: porsi kerugian scam dari investment fraud
        en: scam-loss share driven by investment fraud
      note:
        id: FBI menyebut investment fraud sebagai pendorong utama kerugian scam pada 2025.
        en: The FBI described investment fraud as the main driver of scam-related losses in 2025.
      source: fbi_ic3_2025
    - value: $6.57B
      label:
        id: kerugian investment fraud
        en: investment fraud losses
      note:
        id: Pada 2024, investment fraud menjadi kategori kerugian terbesar dalam laporan IC3.
        en: In 2024, investment fraud was the largest loss category in the IC3 report.
      source: fbi_ic3_2024
  ransomware_recovery:
    context:
      id: Ransomware membuat backup, patching, pemulihan akses, dan latihan respons menjadi kebutuhan operasional, terutama
        untuk bisnis kecil.
      en: Ransomware makes backup, patching, access recovery, and response practice operational requirements, especially for
        small businesses.
    stats:
    - value: 44%
      label:
        id: pelanggaran melibatkan ransomware
        en: breaches involved ransomware
      note:
        id: Verizon DBIR melaporkan ransomware muncul pada 44% pelanggaran.
        en: Verizon DBIR reported ransomware in 44% of breaches.
      source: verizon_dbir_2025
    - value: 37%
      label:
        id: kenaikan ransomware dibanding tahun sebelumnya
        en: ransomware increase year over year
      note:
        id: DBIR mencatat kenaikan ransomware dibanding laporan sebelumnya.
        en: DBIR recorded a ransomware increase compared with the previous report.
      source: verizon_dbir_2025
    - value: $5.13M
      label:
        id: biaya rata-rata breach terkait ransomware
        en: average cost of a ransomware-related breach
      note:
        id: IBM menghitung insiden breach yang melibatkan ransomware berada di atas rata-rata biaya breach global.
        en: IBM found ransomware-related breaches cost more than the global average breach.
      source: ibm_codbr_2025
    - value: 4,800+
      label:
        id: organisasi infrastruktur kritis melapor ke IC3
        en: critical infrastructure organizations reported to IC3
      note:
        id: FBI IC3 2024 mencatat ribuan organisasi infrastruktur kritis terdampak ancaman siber, termasuk ransomware dan
          data breach.
        en: FBI IC3 2024 recorded thousands of critical infrastructure organizations affected by cyber threats, including
          ransomware and data breaches.
      source: fbi_ic3_2024
  data_breach_privacy:
    context:
      id: Data pribadi, data pelanggan, file cloud, dan perangkat bekas menjadi bernilai karena biaya pemulihan breach tetap
        tinggi.
      en: Personal data, customer data, cloud files, and used devices carry value because breach recovery costs remain high.
    stats:
    - value: $4.44M
      label:
        id: biaya rata-rata data breach global
        en: global average data breach cost
      note:
        id: IBM mengukur biaya rata-rata breach global pada 2025.
        en: IBM measured the global average breach cost in 2025.
      source: ibm_codbr_2025
    - value: 241 hari
      label:
        id: rata-rata siklus identifikasi dan containment
        en: average identify-and-contain lifecycle
      note:
        id: Siklus panjang. Pencatatan, monitoring, dan respons awal menentukan apakah breach berhenti atau menyebar.
        en: Long breach lifecycles. Logging, monitoring, and early response determine whether a breach stops or spreads.
      source: ibm_codbr_2025
    - value: $10.22M
      label:
        id: biaya rata-rata breach di AS
        en: average breach cost in the US
      note:
        id: IBM melaporkan biaya rata-rata di AS mencapai rekor baru pada 2025.
        en: IBM reported a record average US breach cost in 2025.
      source: ibm_codbr_2025
    - value: $7.42M
      label:
        id: biaya rata-rata breach sektor kesehatan
        en: average healthcare breach cost
      note:
        id: Data kesehatan tetap menjadi kategori paling mahal di laporan IBM.
        en: Healthcare data remained the costliest industry category in IBM's report.
      source: ibm_codbr_2025
  mobile_app:
    context:
      id: Risiko aplikasi palsu, izin berlebih, malware ponsel, dan sideloading terlihat dari telemetry ekosistem Android.
      en: Risks from fake apps, excessive permissions, phone malware, and sideloading dominate Android ecosystem telemetry.
    stats:
    - value: 266M
      label:
        id: instalasi berisiko yang Google blokir
        en: risky installation attempts blocked
      note:
        id: Google Play Protect memblokir ratusan juta percobaan instalasi berisiko pada 2025.
        en: Google Play Protect blocked hundreds of millions of risky installation attempts in 2025.
      source: google_play_2025
    - value: 872K
      label:
        id: aplikasi berisiko tinggi terdeteksi
        en: high-risk applications detected
      note:
        id: Proteksi fraud Google membantu melindungi pengguna dari aplikasi berisiko tinggi.
        en: Google's fraud protection helped protect users from high-risk applications.
      source: google_play_2025
    - value: 2.36M
      label:
        id: aplikasi melanggar kebijakan yang Google cegah
        en: policy-violating apps blocked from publication
      note:
        id: Google mencegah jutaan aplikasi melanggar kebijakan masuk Play pada 2024.
        en: Google stopped millions of policy-violating apps from reaching Play in 2024.
      source: google_play_2024
    - value: 1.3M
      label:
        id: aplikasi yang Google tolak karena akses sensitif berlebih
        en: apps prevented from excessive sensitive access
      note:
        id: Google mencegah aplikasi memperoleh izin yang tidak perlu ke data sensitif.
        en: Google prevented apps from obtaining unnecessary access to sensitive data.
      source: google_play_2024
  web_privacy_tracking:
    context:
      id: Jejak digital, fingerprinting, cookie pihak ketiga, dan metadata lokasi membuat privasi web perlu dikelola sebagai
        kebiasaan.
      en: Digital footprint, fingerprinting, third-party cookies, and location metadata make web privacy a habit, not a one-time
        setting.
    stats:
    - value: 61%
      label:
        id: cookie dari konteks pihak ketiga
        en: cookies set in a third-party context
      note:
        id: HTTP Archive Web Almanac menemukan mayoritas cookie di web muncul dari konteks pihak ketiga.
        en: HTTP Archive Web Almanac found most web cookies were set in third-party contexts.
      source: httparchive_cookies_2024
    - value: 25%+
      label:
        id: halaman memuat doubleclick.com
        en: pages included doubleclick.com
      note:
        id: Bab Privacy Web Almanac menyebut DoubleClick sebagai sumber cookie pihak ketiga terbesar.
        en: The Web Almanac Privacy chapter named DoubleClick as the largest source of third-party cookies.
      source: httparchive_privacy_2024
    - value: 6%
      label:
        id: cookie pihak ketiga memakai partitioning
        en: third-party cookies used partitioning
      note:
        id: Adopsi partitioning cookie yang membatasi pelacakan lintas situs masih kecil.
        en: Cookie partitioning that limits cross-site tracking still had low adoption.
      source: httparchive_cookies_2024
    - value: 16.9M
      label:
        id: situs dalam dataset Web Almanac
        en: sites in the Web Almanac dataset
      note:
        id: Web Almanac 2024 memakai crawl HTTP Archive berskala jutaan situs.
        en: Web Almanac 2024 used an HTTP Archive crawl spanning millions of sites.
      source: httparchive_cookies_2024
  vulnerability_patch:
    context:
      id: 'Patch, update, hardening router, VPN, browser, dan perangkat IoT: semua harus menjadi prioritas. Eksploitasi celah
        terus menjadi akses awal.'
      en: Patch, update, router hardening, VPN, browser, and IoT work need priority because vulnerability exploitation remains
        a common entry point.
    stats:
    - value: 34%
      label:
        id: kenaikan eksploitasi kerentanan
        en: increase in vulnerability exploitation
      note:
        id: Verizon DBIR mencatat lonjakan eksploitasi kerentanan sebagai vektor akses awal.
        en: Verizon DBIR recorded a jump in vulnerability exploitation as an initial access vector.
      source: verizon_dbir_2025
    - value: 20%
      label:
        id: pelanggaran bermula dari eksploitasi celah
        en: breaches started with vulnerability exploitation
      note:
        id: Eksploitasi kerentanan berada dekat dengan credential abuse sebagai vektor awal.
        en: Vulnerability exploitation ranked close to credential abuse as an initial vector.
      source: verizon_dbir_2025
    - value: 22%
      label:
        id: eksploitasi celah menargetkan edge/VPN zero-day
        en: vulnerability exploits targeted edge/VPN zero-days
      note:
        id: DBIR menyorot perangkat perimeter dan VPN sebagai target eksploitasi yang menonjol.
        en: DBIR highlighted perimeter and VPN devices as notable exploitation targets.
      source: verizon_dbir_2025
    - value: 32 hari
      label:
        id: median waktu remediasi edge/VPN
        en: median edge/VPN remediation time
      note:
        id: Keterlambatan patch memberi penyerang jendela waktu yang cukup panjang.
        en: Patch delay gives attackers a meaningful exploitation window.
      source: verizon_dbir_2025
  supply_chain:
    context:
      id: Ketergantungan pada vendor, integrasi, plugin, API, dan pihak ketiga membuat risiko supply chain harus terlihat
        dalam akses dan kontrak.
      en: Vendor, integration, plugin, API, and third-party dependencies make supply-chain risk a matter of access and contracts.
    stats:
    - value: 30%
      label:
        id: pelanggaran melibatkan pihak ketiga
        en: breaches involved third parties
      note:
        id: Verizon DBIR menyebut keterlibatan pihak ketiga pada pelanggaran naik menjadi 30%.
        en: Verizon DBIR said third-party involvement in breaches rose to 30%.
      source: verizon_dbir_2025
    - value: 2x
      label:
        id: kenaikan keterlibatan pihak ketiga
        en: increase in third-party involvement
      note:
        id: Porsi pelanggaran terkait pihak ketiga berlipat ganda dari laporan sebelumnya.
        en: The share of breaches involving third parties doubled from the previous report.
      source: verizon_dbir_2025
    - value: 15%
      label:
        id: breach berasal dari supply-chain compromise
        en: breaches came from supply-chain compromise
      note:
        id: IBM menempatkan compromise supply chain sebagai salah satu akar breach yang menonjol pada 2025.
        en: IBM listed supply-chain compromise as a notable root cause of breaches in 2025.
      source: ibm_codbr_2025
    - value: 267 hari
      label:
        id: rata-rata lifecycle breach supply chain
        en: average supply-chain breach lifecycle
      note:
        id: Breach melalui rantai pasok butuh waktu lebih lama untuk Anda temukan dan kendalikan.
        en: Supply-chain breaches tend to take longer to identify and contain.
      source: ibm_codbr_2025
  ai_shadow:
    context:
      id: AI membantu pertahanan, tetapi shadow AI, data sensitif di chatbot, dan kontrol akses yang lemah menambah biaya
        breach.
      en: AI helps defense, but shadow AI, sensitive data in chatbots, and weak access controls add breach cost.
    stats:
    - value: 20%
      label:
        id: organisasi breach punya isu shadow AI
        en: breached organizations had shadow AI issues
      note:
        id: IBM melaporkan satu dari lima organisasi yang mengalami breach memiliki masalah terkait shadow AI.
        en: IBM reported one in five breached organizations had a shadow AI issue.
      source: ibm_codbr_2025
    - value: $670K
      label:
        id: tambahan biaya rata-rata dari shadow AI
        en: average added cost from shadow AI
      note:
        id: Shadow AI menaikkan biaya rata-rata breach dibanding organisasi tanpa isu tersebut.
        en: Shadow AI increased average breach cost compared with organizations without that issue.
      source: ibm_codbr_2025
    - value: 97%
      label:
        id: insiden AI tanpa kontrol akses memadai
        en: AI incidents lacked proper access controls
      note:
        id: IBM menemukan hampir semua organisasi dengan insiden keamanan AI tidak memiliki kontrol akses yang layak.
        en: IBM found almost all organizations with AI security incidents lacked proper access controls.
      source: ibm_codbr_2025
    - value: $893M
      label:
        id: kerugian aduan terkait AI
        en: losses from AI-related complaints
      note:
        id: FBI IC3 untuk pertama kali memuat bagian AI dan mencatat kerugian mendekati 893 juta dolar.
        en: FBI IC3 added an AI section and reported nearly 893 million dollars in losses.
      source: fbi_ic3_2025
  deepfake_ai_abuse:
    context:
      id: Deepfake, voice clone, dan profil palsu memperkuat penipuan karena korban melihat atau mendengar sinyal yang terasa
        familiar.
      en: Deepfakes, voice clones, and fake profiles strengthen fraud because victims see or hear signals that feel familiar.
    stats:
    - value: 22,364
      label:
        id: aduan terkait AI
        en: AI-related complaints
      note:
        id: FBI IC3 mencatat puluhan ribu aduan yang melibatkan AI pada 2025.
        en: FBI IC3 recorded tens of thousands of complaints involving AI in 2025.
      source: fbi_ic3_2025
    - value: $893M
      label:
        id: kerugian aduan terkait AI
        en: AI-related complaint losses
      note:
        id: Kerugian ini mencakup penggunaan profil palsu, voice clone, dan video meyakinkan dalam skema scam.
        en: 'Fake profiles, voice clones, and convincing videos: all weaponized for scams.'
      source: fbi_ic3_2025
    - value: 16%
      label:
        id: breach melibatkan penggunaan AI oleh penyerang
        en: breaches involved attacker use of AI
      note:
        id: IBM melaporkan sebagian breach melibatkan AI, terutama phishing buatan AI dan impersonasi deepfake.
        en: IBM reported some breaches involved AI, especially AI-generated phishing and deepfake impersonation.
      source: ibm_codbr_2025
    - value: 35%
      label:
        id: kasus AI attacker berupa impersonasi deepfake
        en: attacker AI cases used deepfake impersonation
      note:
        id: IBM mengaitkan sebagian penggunaan AI oleh penyerang dengan impersonasi deepfake.
        en: IBM tied part of attacker AI use to deepfake impersonation.
      source: ibm_codbr_2025
  incident_response:
    context:
      id: Latihan respons, inventaris aset, jalur kontak, dan dokumentasi membantu menekan dampak saat insiden sudah terjadi.
      en: Response drills, asset inventory, contact paths, and documentation reduce impact after an incident starts.
    stats:
    - value: 241 hari
      label:
